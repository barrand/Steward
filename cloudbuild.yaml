steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/stew-bot:$COMMIT_SHA', './bot']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stew-bot:$COMMIT_SHA']

  # Also tag as latest
  - name: 'gcr.io/cloud-builders/docker'
    args: ['tag', 'gcr.io/$PROJECT_ID/stew-bot:$COMMIT_SHA', 'gcr.io/$PROJECT_ID/stew-bot:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stew-bot:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - stew-bot
      - --image=gcr.io/$PROJECT_ID/stew-bot:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --project=$PROJECT_ID

options:
  logging: CLOUD_LOGGING_ONLY
